# Sample manifest for local/dev use. In the orchestration repo this should be
# replaced by a Secret generated from a vault/CI pipeline, never committed with real values.
apiVersion: v1
kind: Secret
metadata:
  name: user-api-secret
  namespace: fiapgames
  labels:
    app: user-api
type: Opaque
stringData:
  Jwt__SecretKey: "dev-only-change-this-secret-key-32-bytes-minimum"
  RabbitMq__UserName: "fiapgames-admin"
  RabbitMq__Password: "FiapGames@Admin123"
  ConnectionStrings__SqlServer: "Server=sqlserver-users,1433;Database=UserGamesFiap;User Id=sa;Password=RootPassword123!;TrustServerCertificate=True;Encrypt=False"
  # Chave da Azure Function de notificações. 
  Notifications__FunctionKey: ""
