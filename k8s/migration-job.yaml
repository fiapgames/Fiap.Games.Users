apiVersion: batch/v1
kind: Job
metadata:
  name: user-api-migrate
  namespace: fiapgames
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-sqlserver-users
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 sqlserver-users.fiapgames.svc.cluster.local 1433; do
                echo "waiting for sqlserver-users..."
                sleep 2
              done
      containers:
        - name: migrate
          image: user-games-fiap:latest
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: user-api-config
            - secretRef:
                name: user-api-secret
