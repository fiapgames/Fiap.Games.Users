apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: games-fiap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-api
  template:
    metadata:
      labels:
        app: user-api
    spec:
      containers:
        - name: user-api
          image: user-games-fiap:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__MigrateOnStartup
              value: "false"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: SA_PASSWORD
            - name: ConnectionStrings__SqlServer
              value: "Server=sqlserver,1433;Database=UserGamesFiap;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True;Encrypt=False"
            - name: Jwt__Issuer
              value: User.Games.Fiap
            - name: Jwt__Audience
              value: Games.Fiap
            - name: Jwt__AccessTokenMinutes
              value: "15"
            - name: Jwt__RefreshTokenDays
              value: "7"
            - name: RabbitMq__HostName
              value: rabbitmq
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__VirtualHost
              value: /
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
          envFrom:
            - secretRef:
                name: user-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-api
  namespace: games-fiap
spec:
  selector:
    app: user-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
